<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0f1115">
<title>Kasa</title>
<style>
:root {
  --bg: #f6f5f2; --kart: #ffffff; --cizgi: #e6e3dc; --yazi: #1b1d21; --soluk: #6b6f76;
  --gelir: #1f8a5b; --gider: #c2453d; --vurgu: #2d5bd7; --golge: 0 1px 2px rgb(0 0 0 / .05);
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #0f1115; --kart: #181b21; --cizgi: #2a2e36; --yazi: #e9eaec; --soluk: #9095a0;
    --gelir: #4cc38a; --gider: #f07167; --vurgu: #7c9cff; --golge: none; }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--yazi); font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  font-variant-numeric: tabular-nums; -webkit-tap-highlight-color: transparent; }
button, input, select { font: inherit; color: inherit; }
input, select { font-size: 16px; } /* iOS yakınlaştırmasın */
.sar { max-width: 960px; margin: 0 auto; padding: 16px 16px calc(96px + env(safe-area-inset-bottom)); }
header { display: flex; align-items: center; justify-content: space-between; padding: 8px 0 16px; }
h1 { font-size: 20px; margin: 0; letter-spacing: -.01em; }
h2 { font-size: 13px; font-weight: 600; color: var(--soluk); text-transform: uppercase; letter-spacing: .06em; margin: 0 0 12px; }
.kart { background: var(--kart); border: 1px solid var(--cizgi); border-radius: 14px; padding: 16px; box-shadow: var(--golge); }
.izgara { display: grid; gap: 12px; }
@media (min-width: 720px) { .izgara.iki { grid-template-columns: 1fr 1fr; } }
.ust { display: grid; gap: 12px; grid-template-columns: 1fr 1fr; }
.ust .kart:first-child, .ust .kart:last-child { grid-column: 1 / -1; }
@media (min-width: 720px) { .ust { grid-template-columns: 2fr 1fr 1fr 1fr; } .ust .kart:first-child, .ust .kart:last-child { grid-column: auto; } }
.etiket { color: var(--soluk); font-size: 13px; }
.buyuk { font-size: 28px; font-weight: 650; letter-spacing: -.02em; margin-top: 2px; }
.orta { font-size: 19px; font-weight: 600; margin-top: 2px; }
.not { color: var(--soluk); font-size: 13px; margin-top: 4px; }
.yesil { color: var(--gelir); } .kirmizi { color: var(--gider); }
.satir { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-top: 1px solid var(--cizgi); }
.satir:first-child { border-top: 0; }
.satir .ad { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.satir .alt { color: var(--soluk); font-size: 12.5px; }
.nokta { width: 10px; height: 10px; border-radius: 50%; flex: none; }
.cubuk { height: 6px; border-radius: 3px; background: var(--cizgi); margin-top: 6px; overflow: hidden; }
.cubuk i { display: block; height: 100%; border-radius: 3px; }
.rozet { font-size: 12px; padding: 1px 7px; border-radius: 99px; background: var(--cizgi); color: var(--soluk); white-space: nowrap; }
.rozet.kotu { background: color-mix(in srgb, var(--gider) 15%, transparent); color: var(--gider); }
.rozet.iyi { background: color-mix(in srgb, var(--gelir) 15%, transparent); color: var(--gelir); }
.grafik { position: relative; height: 240px; }
.gun { font-size: 12.5px; color: var(--soluk); margin: 18px 0 4px; display: flex; justify-content: space-between; }
.araclar { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
.araclar > * { flex: 1 1 140px; }
input, select { background: var(--kart); border: 1px solid var(--cizgi); border-radius: 10px; padding: 10px 12px; width: 100%; }
.dugme { border: 0; border-radius: 10px; padding: 11px 16px; background: var(--vurgu); color: #fff; font-weight: 600; cursor: pointer; }
.dugme.ikinci { background: var(--cizgi); color: var(--yazi); }
.silik { background: none; border: 0; color: var(--soluk); cursor: pointer; padding: 6px; }
/* sekmeler: mobilde altta, geniş ekranda başlıkta */
nav { position: fixed; left: 0; right: 0; bottom: 0; display: flex; background: var(--kart); border-top: 1px solid var(--cizgi);
  padding-bottom: env(safe-area-inset-bottom); z-index: 5; }
nav button { flex: 1; background: none; border: 0; padding: 12px 0 10px; color: var(--soluk); font-size: 13px; cursor: pointer; }
nav button.on { color: var(--vurgu); font-weight: 600; }
@media (min-width: 720px) {
  nav { position: static; border: 1px solid var(--cizgi); border-radius: 12px; padding: 4px; margin-bottom: 16px; }
  nav button { border-radius: 9px; padding: 8px 0; }
  nav button.on { background: var(--bg); }
}
.ekle { position: fixed; right: 16px; bottom: calc(68px + env(safe-area-inset-bottom)); width: 56px; height: 56px; border-radius: 50%;
  border: 0; background: var(--vurgu); color: #fff; font-size: 28px; box-shadow: 0 6px 20px rgb(0 0 0 / .25); cursor: pointer; z-index: 6; }
@media (min-width: 720px) { .ekle { bottom: 24px; right: 24px; } }
dialog { border: 1px solid var(--cizgi); border-radius: 16px; background: var(--kart); color: var(--yazi); width: min(440px, calc(100% - 32px)); padding: 20px; }
dialog::backdrop { background: rgb(0 0 0 / .45); }
dialog form { display: grid; gap: 10px; }
.secim { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; background: var(--bg); padding: 4px; border-radius: 10px; }
.secim label { text-align: center; padding: 8px 0; border-radius: 8px; cursor: pointer; color: var(--soluk); }
.secim input { display: none; }
.secim label:has(input:checked) { background: var(--kart); color: var(--yazi); font-weight: 600; box-shadow: var(--golge); }
#giris { max-width: 360px; margin: 18vh auto 0; display: grid; gap: 10px; padding: 0 16px; }
.hata { color: var(--gider); font-size: 14px; min-height: 1em; }
.bos { color: var(--soluk); text-align: center; padding: 24px 0; }
[hidden] { display: none !important; }
</style>
</head>
<body>

<form id="giris" hidden>
  <h1>Kasa</h1>
  <input id="em" type="email" placeholder="E-posta" autocomplete="username" required>
  <input id="pw" type="password" placeholder="Parola" autocomplete="current-password" required>
  <button class="dugme">Giriş</button>
  <div class="hata" id="ghata"></div>
</form>

<div class="sar" id="uygulama" hidden>
  <header><h1>Kasa</h1><button class="silik" id="cik">Çıkış</button></header>
  <nav>
    <button data-s="ozet" class="on">Özet</button>
    <button data-s="nereye">Nereye gitti</button>
    <button data-s="islemler">İşlemler</button>
  </nav>

  <section id="s-ozet" class="izgara">
    <div class="ust" id="ustKartlar"></div>
    <div class="izgara iki">
      <div class="kart"><h2>Son 6 ay</h2><div class="grafik"><canvas id="gAylar"></canvas></div></div>
      <div class="kart"><h2>Hesaplar</h2><div id="hesaplar"></div></div>
    </div>
    <div class="kart"><h2>Gelir yapısı (bu ay)</h2><div id="gelirYapi"></div></div>
  </section>

  <section id="s-nereye" class="izgara" hidden>
    <div class="araclar"><input type="month" id="ay"></div>
    <div class="izgara iki">
      <div class="kart"><h2>Dağılım</h2><div class="grafik"><canvas id="gPasta"></canvas></div><div class="not" id="pastaNot"></div></div>
      <div class="kart"><h2>Kategoriler · 3 aylık ortalamaya göre</h2><div id="katListe"></div></div>
    </div>
  </section>

  <section id="s-islemler" hidden>
    <div class="araclar">
      <input type="search" id="ara" placeholder="Ara…">
      <select id="katFiltre"><option value="">Tüm kategoriler</option></select>
    </div>
    <div class="kart" id="liste"></div>
  </section>
</div>

<button class="ekle" id="ekleBtn" hidden aria-label="İşlem ekle">+</button>

<dialog id="ekleDlg">
  <form method="dialog" id="ekleForm">
    <h2 id="fBaslik" style="margin:0">Yeni kayıt</h2>
    <div class="secim">
      <label><input type="radio" name="yon" value="gider" checked>Gider</label>
      <label><input type="radio" name="yon" value="gelir">Gelir</label>
      <label><input type="radio" name="yon" value="transfer">Transfer</label>
    </div>
    <input name="tutar" inputmode="decimal" placeholder="Tutar (₺)" required autocomplete="off">
    <select name="kategori_id" id="fKat"></select>
    <select name="hesap_id" id="fHesap"></select>
    <select name="hedef_hesap_id" id="fHedef" hidden></select>
    <input name="aciklama" placeholder="Açıklama (isteğe bağlı)" autocomplete="off">
    <input name="tarih" type="date" required>
    <div class="hata" id="fHata"></div>
    <div style="display:flex;gap:8px"><button class="dugme ikinci" value="iptal" formnovalidate style="flex:1">Vazgeç</button><button class="dugme" value="kaydet" style="flex:2">Kaydet</button></div>
  </form>
</dialog>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));
const TL = n => Number(n).toLocaleString('tr-TR', {maximumFractionDigits: 0}) + ' ₺';
const ayAnahtar = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
const AYLAR = ['Oca', 'Şub', 'Mar', 'Nis', 'May', 'Haz', 'Tem', 'Ağu', 'Eyl', 'Eki', 'Kas', 'Ara'];
const sakla = {al: k => { try { return localStorage.getItem(k); } catch { return null; } },
  koy: (k, v) => { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch {} }};

/* ---------- oturum: refresh token cihazda kalır, telefonda her seferinde giriş istenmez ---------- */
let tok = null;
async function authIste(govde, tur) {
  const r = await fetch(`${CFG.URL}/auth/v1/token?grant_type=${tur}`, {method: 'POST', headers: {apikey: CFG.ANON, 'Content-Type': 'application/json'}, body: JSON.stringify(govde)});
  const j = await r.json();
  if (!j.access_token) throw new Error(j.error_code === 'invalid_credentials' ? 'E-posta ya da parola hatalı.' : (j.msg || j.error_description || r.status));
  tok = j.access_token; sakla.koy('kasa_rt', j.refresh_token);
}
async function api(yol, o = {}, tekrar = true) {
  const r = await fetch(CFG.URL + '/rest/v1/' + yol, {...o, headers: {apikey: CFG.ANON, Authorization: 'Bearer ' + tok, 'Content-Type': 'application/json', ...(o.headers || {})}});
  if (r.status === 401 && tekrar && sakla.al('kasa_rt')) { await authIste({refresh_token: sakla.al('kasa_rt')}, 'refresh_token'); return api(yol, o, false); }
  if (!r.ok) throw new Error((await r.json().catch(() => ({}))).message || r.status);
  return r.status === 204 ? null : r.json().catch(() => null);
}
function girisGoster(m = '') { $('giris').hidden = false; $('uygulama').hidden = true; $('ekleBtn').hidden = true; $('ghata').textContent = m; }
$('giris').onsubmit = async e => {
  e.preventDefault();
  try { await authIste({email: $('em').value.trim().toLowerCase(), password: $('pw').value}, 'password'); await ac(); }
  catch (err) { girisGoster(err.message); }
};
$('cik').onclick = () => { sakla.koy('kasa_rt', null); tok = null; girisGoster(); };

/* ---------- veri ---------- */
let K = [], H = [], B = [], I = [];
const kat = id => K.find(k => k.id === id) || {ad: '—', renk: '#888', tur: 'gider'};
const hes = id => H.find(h => h.id === id) || {ad: '—'};
async function yukle() {
  const bas = new Date(); bas.setMonth(bas.getMonth() - 12, 1); bas.setHours(0, 0, 0, 0);
  [K, H, B, I] = await Promise.all([
    api('kategori?select=*&order=id'), api('hesap?select=*&aktif=eq.true&order=id'), api('bakiye?select=*&order=id'),
    api(`islem?select=*&tarih=gte.${bas.toISOString()}&order=tarih.desc,id.desc`),
  ]);
  I.forEach(i => { i.tutar = Number(i.tutar); i.d = new Date(i.tarih); });
}
// Bir ayın harcama/gelir toplamları. Transferler (altın alımı, ATM, borç) harcama değildir.
function ayOzet(anahtar) {
  const o = {gelir: 0, gider: 0, yatirim: 0, pasif: 0, kat: {}};
  for (const i of I) {
    if (i.yon === 'transfer' || ayAnahtar(i.d) !== anahtar) continue;
    const k = kat(i.kategori_id);
    if (i.yon === 'gelir') { o.gelir += i.tutar; if (k.pasif) o.pasif += i.tutar; continue; }
    if (k.tur === 'yatirim') o.yatirim += i.tutar; else o.gider += i.tutar;
    o.kat[i.kategori_id] = (o.kat[i.kategori_id] || 0) + i.tutar;
  }
  return o;
}
const ayGeri = (n, d = new Date()) => { const x = new Date(d.getFullYear(), d.getMonth() - n, 1); return ayAnahtar(x); };

/* ---------- Özet ---------- */
let gAylar, gPasta;
function ozetCiz() {
  const simdi = new Date(), bu = ayOzet(ayAnahtar(simdi));
  const net = B.reduce((s, b) => s + Number(b.bakiye), 0);
  const gun = simdi.getDate(), ayGun = new Date(simdi.getFullYear(), simdi.getMonth() + 1, 0).getDate();
  const tahmin = bu.gider / gun * ayGun;
  const kalan = bu.gelir - bu.gider - bu.yatirim;
  const oran = bu.gelir ? Math.round((bu.gelir - bu.gider) / bu.gelir * 100) : null;
  $('ustKartlar').innerHTML = `
    <div class="kart"><div class="etiket">Net varlık</div><div class="buyuk">${TL(net)}</div><div class="not">Tüm hesaplar, kart borcu düşülmüş</div></div>
    <div class="kart"><div class="etiket">Bu ay gelir</div><div class="orta yesil">${TL(bu.gelir)}</div></div>
    <div class="kart"><div class="etiket">Bu ay gider</div><div class="orta kirmizi">${TL(bu.gider)}</div><div class="not">Bu hızla ay sonu ≈ ${TL(tahmin)}</div></div>
    <div class="kart"><div class="etiket">Kalan</div><div class="orta">${TL(kalan)}</div><div class="not">${oran == null ? 'Gelir girilmedi' : `Tasarruf oranı %${oran}`}${bu.yatirim ? ` · yatırım ${TL(bu.yatirim)}` : ''}</div></div>`;

  const anahtarlar = [5, 4, 3, 2, 1, 0].map(n => ayGeri(n));
  const ozetler = anahtarlar.map(ayOzet);
  const renk = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
  gAylar?.destroy();
  gAylar = new Chart($('gAylar'), {
    type: 'bar',
    data: {labels: anahtarlar.map(a => AYLAR[+a.slice(5) - 1]), datasets: [
      {label: 'Gelir', data: ozetler.map(o => o.gelir), backgroundColor: renk('--gelir'), borderRadius: 4},
      {label: 'Gider', data: ozetler.map(o => o.gider), backgroundColor: renk('--gider'), borderRadius: 4},
    ]},
    options: {maintainAspectRatio: false, plugins: {legend: {labels: {color: renk('--soluk'), boxWidth: 10}}, tooltip: {callbacks: {label: c => c.dataset.label + ': ' + TL(c.raw)}}},
      scales: {x: {grid: {display: false}, ticks: {color: renk('--soluk')}}, y: {grid: {color: renk('--cizgi')}, ticks: {color: renk('--soluk'), callback: v => v >= 1000 ? v / 1000 + 'b' : v}}}},
  });

  $('hesaplar').innerHTML = B.map(b => `<div class="satir"><span class="ad">${esc(b.ad)}</span><b class="${b.bakiye < 0 ? 'kirmizi' : ''}">${TL(b.bakiye)}</b></div>`).join('');

  const aktif = bu.gelir - bu.pasif;
  const karsilama = bu.gider ? Math.min(100, Math.round(bu.pasif / bu.gider * 100)) : 0;
  $('gelirYapi').innerHTML = bu.gelir ? `
    <div class="satir"><span class="nokta" style="background:var(--gelir)"></span><span class="ad">Aktif gelir</span><b>${TL(aktif)}</b></div>
    <div class="satir"><span class="nokta" style="background:#ca8a04"></span><span class="ad">Pasif gelir</span><b>${TL(bu.pasif)}</b></div>
    <div class="not">Pasif gelir, giderlerin <b>%${karsilama}</b> kadarını karşılıyor. %100 olunca çalışmasan da geçinirsin.</div>
    <div class="cubuk"><i style="width:${karsilama}%;background:#ca8a04"></i></div>` : '<div class="bos">Bu ay gelir kaydı yok.</div>';
}

/* ---------- Nereye gitti ---------- */
function nereyeCiz() {
  const a = $('ay').value, o = ayOzet(a);
  const d = new Date(+a.slice(0, 4), +a.slice(5) - 1, 1);
  const onceki = [1, 2, 3].map(n => ayOzet(ayGeri(n, d)));
  const sirali = Object.entries(o.kat).map(([id, t]) => ({k: kat(+id), t, ort: onceki.reduce((s, x) => s + (x.kat[id] || 0), 0) / 3})).sort((x, y) => y.t - x.t);
  const toplam = o.gider + o.yatirim;
  gPasta?.destroy();
  gPasta = new Chart($('gPasta'), {
    type: 'doughnut',
    data: {labels: sirali.map(s => s.k.ad), datasets: [{data: sirali.map(s => s.t), backgroundColor: sirali.map(s => s.k.renk), borderWidth: 0}]},
    options: {maintainAspectRatio: false, cutout: '68%', plugins: {legend: {display: false}, tooltip: {callbacks: {label: c => `${c.label}: ${TL(c.raw)} (%${Math.round(c.raw / toplam * 100)})`}}}},
  });
  $('pastaNot').textContent = toplam ? `Toplam ${TL(o.gider)} harcama${o.yatirim ? ` + ${TL(o.yatirim)} yatırım` : ''}` : 'Bu ay kayıt yok.';
  $('katListe').innerHTML = sirali.map(s => {
    const fark = s.ort ? Math.round((s.t - s.ort) / s.ort * 100) : null;
    const rozet = fark == null ? '<span class="rozet">yeni</span>' : `<span class="rozet ${fark > 15 ? 'kotu' : fark < -15 ? 'iyi' : ''}">${fark > 0 ? '+' : ''}${fark}%</span>`;
    return `<div class="satir" style="display:block;cursor:pointer" data-k="${s.k.id}">
      <div style="display:flex;gap:10px;align-items:center"><span class="nokta" style="background:${s.k.renk}"></span><span class="ad">${esc(s.k.ad)}</span>${rozet}<b>${TL(s.t)}</b></div>
      <div class="cubuk"><i style="width:${s.t / sirali[0].t * 100}%;background:${s.k.renk}"></i></div></div>`;
  }).join('') || '<div class="bos">Bu ay harcama yok.</div>';
}
$('ay').onchange = nereyeCiz;
$('katListe').onclick = e => { const s = e.target.closest('[data-k]'); if (!s) return; $('katFiltre').value = s.dataset.k; sekme('islemler'); };

/* ---------- İşlemler ---------- */
function listeCiz() {
  const q = $('ara').value.toLocaleLowerCase('tr'), kf = +$('katFiltre').value;
  const s = I.filter(i => (!kf || i.kategori_id === kf) && (!q || (i.aciklama || '').toLocaleLowerCase('tr').includes(q) || kat(i.kategori_id).ad.toLocaleLowerCase('tr').includes(q))).slice(0, 300);
  let son = '', html = '';
  for (const i of s) {
    const g = i.d.toLocaleDateString('tr-TR', {day: 'numeric', month: 'long', weekday: 'short'});
    if (g !== son) { html += `<div class="gun"><span>${g}</span></div>`; son = g; }
    const k = kat(i.kategori_id), tr = i.yon === 'transfer';
    const baslik = tr ? `${i.hesap_id ? esc(hes(i.hesap_id).ad) : 'Dışarıdan'} → ${i.hedef_hesap_id ? esc(hes(i.hedef_hesap_id).ad) : 'Dışarıya'}` : esc(k.ad);
    const tutar = tr ? `<span>${TL(i.tutar)}</span>` : `<b class="${i.yon === 'gelir' ? 'yesil' : ''}">${i.yon === 'gelir' ? '+' : '−'}${TL(i.tutar)}</b>`;
    html += `<div class="satir" data-id="${i.id}" style="cursor:pointer"><span class="nokta" style="background:${tr ? 'var(--soluk)' : k.renk}"></span>
      <div class="ad">${baslik}<div class="alt">${[i.aciklama, tr ? '' : hes(i.hesap_id).ad].filter(Boolean).map(esc).join(' · ')}</div></div>${tutar}
      <button class="silik" data-sil="${i.id}" aria-label="Sil">✕</button></div>`;
  }
  $('liste').innerHTML = html || '<div class="bos">Kayıt yok.</div>';
}
$('ara').oninput = listeCiz; $('katFiltre').onchange = listeCiz;
$('liste').onclick = async e => {
  const b = e.target.closest('[data-sil]');
  if (!b) { const s = e.target.closest('[data-id]'); if (s) formAc(I.find(x => x.id === +s.dataset.id)); return; }
  const i = I.find(x => x.id === +b.dataset.sil);
  if (!confirm(`${kat(i.kategori_id).ad} ${TL(i.tutar)} silinsin mi?`)) return;
  await api('borc?islem_id=eq.' + i.id, {method: 'DELETE'});
  await api('islem?id=eq.' + i.id, {method: 'DELETE'});
  await yenile();
};

/* ---------- ekle ---------- */
const f = $('ekleForm');
function katSecenek() {
  const yon = f.yon.value;
  $('fKat').hidden = yon === 'transfer'; $('fHedef').hidden = yon !== 'transfer';
  $('fKat').innerHTML = K.filter(k => yon === 'gelir' ? k.tur === 'gelir' : k.tur !== 'gelir').map(k => `<option value="${k.id}">${esc(k.ad)}</option>`).join('');
}
f.querySelectorAll('[name=yon]').forEach(r => r.onchange = katSecenek);
// i verilirse düzenleme (Telegram'dan gelen kaydın kategorisini düzeltmek gibi), yoksa yeni kayıt.
let duzenlenen = null;
function formAc(i = null) {
  duzenlenen = i;
  f.reset(); $('fHata').textContent = ''; $('fBaslik').textContent = i ? 'Kaydı düzenle' : 'Yeni kayıt';
  const ops = H.map(h => `<option value="${h.id}">${esc(h.ad)}</option>`).join('');
  $('fHesap').innerHTML = ops; $('fHedef').innerHTML = ops; $('fHedef').selectedIndex = Math.min(1, H.length - 1);
  f.tarih.value = (i ? i.d : new Date()).toLocaleDateString('sv');
  if (i) f.querySelector(`[name=yon][value=${i.yon}]`).checked = true;
  katSecenek();
  if (i) {
    f.tutar.value = String(i.tutar).replace('.', ',');
    if (i.kategori_id) f.kategori_id.value = i.kategori_id;
    if (i.hesap_id) f.hesap_id.value = i.hesap_id;
    if (i.hedef_hesap_id) f.hedef_hesap_id.value = i.hedef_hesap_id;
    f.aciklama.value = i.aciklama || '';
  }
  $('ekleDlg').showModal(); if (!i) f.tutar.focus();
}
$('ekleBtn').onclick = () => formAc();
f.onsubmit = async e => {
  if (e.submitter?.value !== 'kaydet') return;
  e.preventDefault();
  const tutar = Number(f.tutar.value.replace(/\./g, '').replace(',', '.'));
  if (!(tutar > 0)) return $('fHata').textContent = 'Geçerli bir tutar yaz.';
  const yon = f.yon.value, tr = yon === 'transfer';
  if (tr && f.hesap_id.value === f.hedef_hesap_id.value) return $('fHata').textContent = 'Kaynak ve hedef aynı olamaz.';
  // Gün değişmediyse saat korunur (yeni kayıtta şimdiki an, düzenlemede asıl an).
  const asil = duzenlenen ? duzenlenen.d : new Date();
  const tarih = asil.toLocaleDateString('sv') === f.tarih.value ? asil.toISOString() : new Date(f.tarih.value + 'T12:00').toISOString();
  const satir = {tutar, yon, hesap_id: +f.hesap_id.value, hedef_hesap_id: tr ? +f.hedef_hesap_id.value : null,
    kategori_id: tr ? null : +f.kategori_id.value, aciklama: f.aciklama.value.trim() || null, tarih};
  try {
    if (duzenlenen) await api('islem?id=eq.' + duzenlenen.id, {method: 'PATCH', headers: {Prefer: 'return=minimal'}, body: JSON.stringify(satir)});
    else await api('islem', {method: 'POST', headers: {Prefer: 'return=minimal'}, body: JSON.stringify({...satir, kaynak: 'panel'})});
    $('ekleDlg').close(); await yenile();
  } catch (err) { $('fHata').textContent = 'Kaydedilemedi: ' + err.message; }
};

/* ---------- sekmeler ---------- */
let aktifSekme = sakla.al('kasa_sekme') || 'ozet';
function sekme(s) {
  aktifSekme = s;
  for (const b of document.querySelectorAll('nav button')) b.classList.toggle('on', b.dataset.s === s);
  for (const x of ['ozet', 'nereye', 'islemler']) $('s-' + x).hidden = x !== s;
  ({ozet: ozetCiz, nereye: nereyeCiz, islemler: listeCiz})[s]();
  sakla.koy('kasa_sekme', s);
}
document.querySelector('nav').onclick = e => { const b = e.target.closest('button'); if (b) sekme(b.dataset.s); };

async function yenile() {
  await yukle();
  const secili = $('katFiltre').value;
  $('katFiltre').innerHTML = '<option value="">Tüm kategoriler</option>' + K.map(k => `<option value="${k.id}">${esc(k.ad)}</option>`).join('');
  $('katFiltre').value = secili;
  sekme(aktifSekme);
}
async function ac() {
  $('giris').hidden = true; $('uygulama').hidden = false; $('ekleBtn').hidden = false;
  $('ay').value = ayAnahtar(new Date());
  await yenile();
}
(async () => {
  if (!sakla.al('kasa_rt')) return girisGoster();
  try { await authIste({refresh_token: sakla.al('kasa_rt')}, 'refresh_token'); await ac(); }
  catch { girisGoster(); }
})();
</script>
</body>
